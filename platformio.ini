; Celestium CanSat firmware — Raspberry Pi Pico (RP2040), custom PCB
; Build:  pio run            Flash: pio run -t upload
; Monitor: pio device monitor

[env:pico]
; earlephilhower Pico core (Wire(sda,scl), SPI1 pin remap, USB CDC, Servo)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; RP2040 needs littlefs + max stack for SD/JSON work
board_build.filesystem = littlefs

lib_deps =
    ; ---- sensor drivers (I2C) ----
    adafruit/Adafruit BMP280 Library@^2.6.8        ; temp + pressure (primary mission)
    adafruit/Adafruit LTR390 Library               ; UV radiation
    adafruit/Adafruit TSL2591 Library@^1.4.0       ; IR / visible light
    adafruit/Adafruit SCD30@^1.0.9                 ; CO2 concentration
    adafruit/Adafruit GPS Library@^1.9.0           ; PA1010D over UART (NMEA)
    ; ---- common deps ----
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; ---- radio + storage ----
    mikem/RadioHead@^1.120                         ; RFM96W LoRa 433 MHz
    greiman/SdFat@^2.3.0                           ; microSD logging

build_flags =
    -DUSB_VID=0x2e8a
    -DUSB_PID=0x000a
    -DUSB_MANUFACTURER='"Brighton College"'
    -DUSB_PRODUCT='"Celestium CanSat"'
    -Wno-unknown-pragmas
