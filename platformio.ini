; Celestium CanSat firmware: STM32G474RE, custom PCB, STM32CubeMX workflow
;
; Board config lives in stm32g474.ioc. Open it in STM32CubeMX, verify the
; pin assignments against the PCB, press GENERATE CODE.
; Build here:  pio run     Flash: pio run -t upload     Monitor: pio device monitor

[env:stm32g474]
platform = ststm32
; Custom PCB, chip identical to Nucleo G474RE (STM32G474RET6, LQFP64);
; we only reuse its board definition, all pins come from src/config.h.
board = nucleo_g474re
framework = stm32cube
; we ship our own inc/stm32g4xx_hal_conf.h
board_build.stm32cube.custom_config_header = yes
build_flags =
    -DSTM32G474xx
    -DHSE_VALUE=8000000U
    -Iinc
    -Wno-unused-function
    ; newlib-nano drops float printf by default, which makes every
    ; float in the JSON/CSV print as nothing. Pull it back in:
    -Wl,-u,_printf_float
monitor_speed = 115200
