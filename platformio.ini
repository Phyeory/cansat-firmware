; Celestium CanSat firmware: STM32G474RE, custom PCB, STM32CubeMX workflow
;
; Board config lives in stm32g474.ioc. Open it in STM32CubeMX, verify the
; pin assignments against the PCB, press GENERATE CODE.
; Build here:  pio run     Flash: pio run -t upload     Monitor: pio device monitor

[env:stm32g474]
platform = ststm32
; Custom PCB, chip identical to Nucleo G474RE (STM32G474RET6, LQFP64);
; we only reuse its board definition, all pins come from src/config.h.
board = nucleo_g474re
framework = stm32cube
; we ship our own inc/stm32g4xx_hal_conf.h
board_build.stm32cube.custom_config_header = yes
build_flags =
    -DSTM32G474xx
    -DHSE_VALUE=8000000U
    -Iinc
    -Wno-unused-function
    ; newlib-nano drops float printf by default, which makes every
    ; float in the JSON/CSV print as nothing. Pull it back in:
    -Wl,-u,_printf_float
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Host unit tests: pio test -e native
;
; The real src/*.c files are compiled by clang against test/fakes/
; stm32g4xx_hal.h, so the firmware sources need no test-only edits and nothing
; needs hardware.  Every test suite lives in its own test/test_* directory and
; includes the sources it exercises (see TESTING.md).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu11
    -DUNITY_INCLUDE_DOUBLE
    -I${PROJECT_DIR}/test/fakes
    -I${PROJECT_DIR}/src
    -Wno-unused-function
    -Wno-format
    -Wno-unused-parameter
